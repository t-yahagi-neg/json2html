<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>001 基本表示・フィルター</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="page-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-toolbar">
        <button
          type="button"
          class="sidebar-toggle"
          id="sidebar-toggle"
          aria-expanded="true"
          aria-controls="menu-frame"
          title="メニューを縮小">
          <span class="sidebar-toggle-icon" aria-hidden="true">«</span>
          <span class="sidebar-toggle-label">メニュー</span>
        </button>
      </div>
      <iframe
        id="menu-frame"
        src="./menu.html"
        class="menu-frame"
        title="メニュー">
      </iframe>
    </aside>

    <main class="main-content">
      <header class="page-header">
        <h1>001 基本表示・フィルター</h1>
      </header>

      <section class="table-section">
        <div class="table-filter-bar">
          <span class="table-filter-status" id="table-filter-status" aria-live="polite"></span>
          <button type="button" class="table-filter-clear" id="table-columns-toggle"
            aria-expanded="false" aria-controls="table-columns-panel" aria-haspopup="dialog">
            表示列
          </button>
          <button type="button" class="table-filter-clear" id="table-filter-clear">
            すべてのフィルターをクリア
          </button>
          <button type="button" class="table-filter-clear" id="page-pin-toggle"
            aria-pressed="false" disabled>ピン留め</button>
          <span id="page-pin-status" class="pin-status" role="status" aria-live="polite" hidden></span>
        </div>
        <div class="table-scroll">
          <table id="data-table" data-hidden-column-filter="clear">
            <thead>
              <tr>
                <th data-column-key="番号" data-column-label="番号" data-initial-visible="true">
                  <div class="th-head">
                    <span class="th-label" style="text-align: center">番号</span>
                    <button type="button" class="table-filter-toggle" data-col-index="0" aria-expanded="false" aria-haspopup="dialog" title="番号 のフィルター" aria-label="番号 のフィルター">
                      <span class="table-filter-toggle-icon" aria-hidden="true">▾</span>
                    </button>
                  </div>
                </th>
                <th data-column-key="状態" data-column-label="状態" data-initial-visible="true">
                  <div class="th-head">
                    <span class="th-label" style="text-align: center">状態</span>
                    <button type="button" class="table-filter-toggle" data-col-index="1" aria-expanded="false" aria-haspopup="dialog" title="状態 のフィルター" aria-label="状態 のフィルター">
                      <span class="table-filter-toggle-icon" aria-hidden="true">▾</span>
                    </button>
                  </div>
                </th>
                <th data-column-key="担当" data-column-label="担当" data-initial-visible="true">
                  <div class="th-head">
                    <span class="th-label" style="text-align: center">担当</span>
                    <button type="button" class="table-filter-toggle" data-col-index="2" aria-expanded="false" aria-haspopup="dialog" title="担当 のフィルター" aria-label="担当 のフィルター">
                      <span class="table-filter-toggle-icon" aria-hidden="true">▾</span>
                    </button>
                  </div>
                </th>
                <th data-column-key="件数" data-column-label="件数" data-initial-visible="true">
                  <div class="th-head">
                    <span class="th-label" style="text-align: center">件数</span>
                    <button type="button" class="table-filter-toggle" data-col-index="3" aria-expanded="false" aria-haspopup="dialog" title="件数 のフィルター" aria-label="件数 のフィルター">
                      <span class="table-filter-toggle-icon" aria-hidden="true">▾</span>
                    </button>
                  </div>
                </th>
                <th data-column-key="備考" data-column-label="備考" data-initial-visible="true">
                  <div class="th-head">
                    <span class="th-label" style="text-align: center">備考</span>
                    <button type="button" class="table-filter-toggle" data-col-index="4" aria-expanded="false" aria-haspopup="dialog" title="備考 のフィルター" aria-label="備考 のフィルター">
                      <span class="table-filter-toggle-icon" aria-hidden="true">▾</span>
                    </button>
                  </div>
                </th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td style="text-align: left" data-filter-value="001" data-filter-label="001">001</td>
                <td style="text-align: left" data-filter-value="完了" data-filter-label="完了">完了</td>
                <td style="text-align: left" data-filter-value="佐藤" data-filter-label="佐藤">佐藤</td>
                <td style="text-align: right" data-filter-value="12" data-filter-label="12">12</td>
                <td style="text-align: left" class="multiline-cell" data-filter-value="通常文字列・日本語の表示を確認します。 / サンプルリンク / 空行を挟んだ説明です。" data-filter-label="通常文字列・日本語の表示を確認します。 / サンプルリンク / 空行を挟んだ説明です。">
                  <div class="multiline-line">通常文字列・日本語の表示を確認します。</div>
                  <div class="multiline-line multiline-link-line"><a href="https://example.com/" target="_blank" rel="noopener noreferrer">サンプルリンク</a></div>
                  <div class="multiline-line multiline-empty-line"><br></div>
                  <div class="multiline-line">空行を挟んだ説明です。</div>
                </td>
              </tr>
              <tr>
                <td style="text-align: left" data-filter-value="002" data-filter-label="002">002</td>
                <td style="text-align: left" data-filter-value="確認中" data-filter-label="確認中">確認中</td>
                <td style="text-align: left" data-filter-value="鈴木" data-filter-label="鈴木">鈴木</td>
                <td style="text-align: right" data-filter-value="0" data-filter-label="0">0</td>
                <td style="text-align: left" class="multiline-cell" data-filter-value="&lt;表示確認&gt; &amp; &quot;文字列&quot; はHTMLとして実行されません。 / 長い文章がセルの幅に応じて折り返され、ほかの列を隠しても内容を確認できることを確かめます。" data-filter-label="&lt;表示確認&gt; &amp; &quot;文字列&quot; はHTMLとして実行されません。 / 長い文章がセルの幅に応じて折り返され、ほかの列を隠しても内容を確認できることを確かめます。">
                  <div class="multiline-line">&lt;表示確認&gt; &amp; &quot;文字列&quot; はHTMLとして実行されません。</div>
                  <div class="multiline-line">長い文章がセルの幅に応じて折り返され、ほかの列を隠しても内容を確認できることを確かめます。</div>
                </td>
              </tr>
              <tr>
                <td style="text-align: left" data-filter-value="003" data-filter-label="003">003</td>
                <td style="text-align: left" data-filter-value="未着手" data-filter-label="未着手">未着手</td>
                <td style="text-align: left" data-filter-value="佐藤" data-filter-label="佐藤">佐藤</td>
                <td style="text-align: right" data-filter-value="7" data-filter-label="7">7</td>
                <td style="text-align: left" class="multiline-cell" data-filter-value="状態と担当の両方で絞り込めます。" data-filter-label="状態と担当の両方で絞り込めます。">
                  <div class="multiline-line">状態と担当の両方で絞り込めます。</div>
                </td>
              </tr>
              <tr>
                <td style="text-align: left" data-filter-value="004" data-filter-label="004">004</td>
                <td style="text-align: left" data-filter-value="完了" data-filter-label="完了">完了</td>
                <td style="text-align: left" data-filter-value="__empty__" data-filter-label="(空白)"></td>
                <td style="text-align: right" data-filter-value="25" data-filter-label="25">25</td>
                <td style="text-align: left" data-filter-value="__empty__" data-filter-label="(空白)"></td>
              </tr>
              <tr>
                <td style="text-align: left" data-filter-value="005" data-filter-label="005">005</td>
                <td style="text-align: left" data-filter-value="確認中" data-filter-label="確認中">確認中</td>
                <td style="text-align: left" data-filter-value="田中" data-filter-label="田中">田中</td>
                <td style="text-align: right" data-filter-value="3" data-filter-label="3">3</td>
                <td style="text-align: left" class="multiline-cell" data-filter-value="状態が「完了」なら2件、さらに担当が「佐藤」なら1件になります。" data-filter-label="状態が「完了」なら2件、さらに担当が「佐藤」なら1件になります。">
                  <div class="multiline-line">状態が「完了」なら2件、さらに担当が「佐藤」なら1件になります。</div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
  <div
    id="table-filter-panel"
    class="table-filter-panel"
    hidden
    role="dialog"
    aria-label="列フィルター">
  </div>
  <div id="table-columns-panel" class="table-columns-panel" hidden
    role="dialog" aria-label="表示列の設定"></div>
  <script src="../js/table-filter.js" defer></script>
  <script src="../js/sidebar-toggle.js" defer></script>

</body>
</html>
